name: Check alerts
on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub's minimum; can run a few minutes late)
  workflow_dispatch:
  push:
    paths: ['alerts.json']  # runs right away when you save alerts, so Discord confirms them
concurrency:
  group: check-alerts
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node check.js
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Save state
        if: always()
        run: |
          git config user.name "alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state" && git pull --rebase && git push)
